spring:
  datasource:
    hikari:
      connection-timeout: 20000
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      data-source-properties:
        sslmode: require
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

mfa:
  encryption-key: ${MFA_ENCRYPTION_KEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

hub:
  flyway:
    # security-api migrates its own schema; hub-api only runs db/hub-migration.
    run-security-migrations: false

# No public API docs in production (same as security-api). Set
# API_DOCS_ENABLED=true to turn both on temporarily.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    root: WARN
    com.henheang.hubapi: INFO
