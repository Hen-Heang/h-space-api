# Test-only, on top of security-api-test.yml (same database, jwt_auth_test).
# hub-api runs in a schema of its own so its tables and migration histories
# never mix with security-api's tests in `public`. Flyway creates the schema
# and keeps all three histories (security, hub, finance) there.
spring:
  datasource:
    hikari:
      schema: hub_api_test
  flyway:
    default-schema: hub_api_test
