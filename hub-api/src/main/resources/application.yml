# hub-api: the deployed H-Space app - auth (security-api, embedded) plus the
# product areas: inbox and H-Vault (/api/hub/**) and finance (/api/finance/**).
#
# Every auth and shared setting (datasource, JWT, MFA, mail, CORS, actuator,
# logging, ...) comes from security-api.yml and security-api-{profile}.yml,
# imported below, so it can't drift from security-api. Values there take
# precedence over this file (order: see security-api.yml): keep only
# hub-specific keys here.
spring:
  application:
    name: hub-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: classpath:security-api.yml

hub:
  # Auth V2 pilot (docs/auth-v2.md). OFF unless HUB_SUPABASE_AUTH_ENABLED=true.
  # On: /api/hub/session and /api/hub/inbox-items accept ONLY Supabase access
  # tokens (verified against <url>/auth/v1/.well-known/jwks.json), check the
  # caller's H-Space admission on every request and require aal2 for the Inbox.
  # Public values only - never the service-role key or the legacy JWT secret.
  supabase-auth:
    enabled: ${HUB_SUPABASE_AUTH_ENABLED:false}
    url: ${HUB_SUPABASE_URL:}
    publishable-key: ${HUB_SUPABASE_PUBLISHABLE_KEY:}
    audience: ${HUB_SUPABASE_AUDIENCE:authenticated}
    admission-timeout: ${HUB_SUPABASE_ADMISSION_TIMEOUT:3s}
  vault:
    # Step-up (a fresh authenticator or backup code) for vault reset and
    # keyset replacement. A code that is sent is always verified; this makes
    # one mandatory. Turn on only after the web app sends `mfaCode`, or
    # master-password change and reset break for the current client.
    step-up-required: ${VAULT_STEP_UP_REQUIRED:false}

server:
  port: ${SERVER_PORT:8084}
