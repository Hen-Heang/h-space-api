spring:
  application:
    name: hub-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    show-sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration

jwt:
  secret: ${JWT_SECRET}
  expiration: PT24H
  refresh-token:
    expiration: P7D

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # CORS origins for security-api's WebSecurityConfig, comma-separated.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  reset-password:
    token-expiration-minutes: 1440
  email:
    from-name: H-Space API Team

hub:
  flyway:
    # security-api owns its migrations (db/migration). Running them here too
    # is convenient locally and in tests, where hub-api is the only app
    # touching the database; prod turns it off so only security-api
    # migrates its own schema. See HubFlywayConfig.
    run-security-migrations: ${HUB_RUN_SECURITY_MIGRATIONS:true}
  vault:
    # Step-up (a fresh authenticator or backup code) for vault reset and
    # keyset replacement. A code that is sent is always verified; this makes
    # one mandatory. Turn on only after the web app sends `mfaCode`, or
    # master-password change and reset break for the current client.
    step-up-required: ${VAULT_STEP_UP_REQUIRED:false}

# Same as security-api: /actuator/health (plus /liveness and /readiness) is
# the only exposed actuator endpoint, public and detail-free. The container
# healthcheck uses /liveness, which doesn't query the database.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false

server:
  port: ${SERVER_PORT:8084}
  # Same as security-api: resolve the client IP from X-Forwarded-For only when
  # the request came from a trusted proxy (RateLimitingFilter keys on it).
  forward-headers-strategy: native

# Prints the request's X-Request-Id (RequestIdFilter in api-core) on every log line.
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
