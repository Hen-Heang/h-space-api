plugins {
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '8.12.0' apply false
}

// Shared dependency versions used by more than one module. Module-specific
// dependency versions stay local to that module's `project(':x') { }` block.
ext {
    mapstructVersion = '1.6.3'
    springdocVersion = '2.10.1'
    jjwtVersion = '0.11.5'
    // Architecture tests (api-core test fixtures, used by hub-api).
    archunitVersion = '1.5.1'
}

allprojects {
    group = 'com.henheang'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'checkstyle'
    apply plugin: 'pmd'
    apply plugin: 'jacoco'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependencies {
        // Common dependencies for ALL modules
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'

        // Spring Boot common dependencies
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        implementation 'org.springframework.boot:spring-boot-starter-validation'
        annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

        // Database
        runtimeOnly 'org.postgresql:postgresql'

        // Testing
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testImplementation 'org.junit.jupiter:junit-jupiter'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
        // Tests always run against the "test" Spring profile (separate DB,
        // non-sensitive JWT secret default) — see application-test.yml.
        systemProperty 'spring.profiles.active', 'test'
    }

    jacoco {
        toolVersion = '0.8.12'
    }

    jacocoTestReport {
        dependsOn test
        reports {
            xml.required = true
            html.required = true
        }
    }

    // Checkstyle/PMD are advisory for now (reports only) so pre-existing code
    // doesn't fail `build` — see docs/coding-standards.md before tightening.
    checkstyle {
        toolVersion = '10.20.2'
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        ignoreFailures = true
        maxWarnings = Integer.MAX_VALUE
    }

    pmd {
        toolVersion = '7.9.0'
        ruleSetFiles = rootProject.files('config/pmd/ruleset.xml')
        ruleSets = []
        ignoreFailures = true
        consoleOutput = true
    }

    spotless {
        java {
            target 'src/*/java/**/*.java'
            googleJavaFormat('1.25.2').aosp()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}

// Configure api-core module (base module - no dependencies on other modules)
project(':api-core') {
    // Test fixtures: test-only helpers that other modules reuse. Holds
    // UserScopedRepositoryRules, the userId-scoping guard that hub-api's
    // tests run against its repositories (hub and finance areas). In api-core so a
    // module can use it without depending on security-api.
    apply plugin: 'java-test-fixtures'

    dependencies {
        // Only basic dependencies, no project dependencies
        implementation "org.mapstruct:mapstruct:${mapstructVersion}"
        annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
        implementation 'commons-beanutils:commons-beanutils:1.11.0'
        implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

        testFixturesApi "com.tngtech.archunit:archunit:${archunitVersion}"
        testFixturesImplementation 'org.springframework.data:spring-data-jpa'
    }
}

// Configure security-api module
project(':security-api') {
    dependencies {
        // Depend on api-core
        implementation project(':api-core')

        // Schema migrations - the only schema authority now (see
        // docs/database.md); ddl-auto is "validate" in every profile.
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-database-postgresql'

        // Security specific dependencies
        implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.44'
        implementation 'org.springframework.boot:spring-boot-starter-mail'
        implementation 'org.apache.commons:commons-lang3:3.22.0'
        implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
        implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

        // JWT
        implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
        implementation "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
        implementation "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

        // Rate limiting
        implementation 'com.bucket4j:bucket4j_jdk17-core:8.22.0'

        // TOTP-based MFA (Google Authenticator / Authy compatible)
        implementation 'dev.samstevens.totp:totp:1.7.1'
        // QR code image rendering for the totp lib's ZxingPngQrGenerator
        implementation 'com.google.zxing:core:3.5.4'
        implementation 'com.google.zxing:javase:3.5.4'

        // Google Sign-In ID token verification
        implementation 'com.google.api-client:google-api-client:2.9.2'

        // Mapping
        implementation "org.mapstruct:mapstruct:${mapstructVersion}"
        annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
        implementation 'commons-beanutils:commons-beanutils:1.11.0'

        // Documentation
        implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

        // Permission cache (see CacheConfig / PermissionQueryService)
        implementation 'org.springframework.boot:spring-boot-starter-cache'
        implementation 'com.github.ben-manes.caffeine:caffeine:3.3.1'

        // Health endpoint for container/orchestrator health checks (see
        // management.* in application.yml)
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
    }
}

// Configure hub-api module: THE deployable H-Space app. It embeds security-api
// (auth) and holds the product areas - inbox and H-Vault (com.henheang.hubapi)
// and finance (com.henheang.financeapi). See docs/architecture.md.
project(':hub-api') {
    dependencies {
        implementation project(':api-core')
        implementation project(':security-api')
        // Auth V2 pilot (off by default): Supabase tokens on the session probe and
        // the Inbox only - see docs/auth-v2.md. No security-api dependency.
        implementation project(':supabase-auth')

        // Validates security-api's JWTs
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
        implementation "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
        implementation "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
        // Controllers take security-api's UserPrincipal, which implements
        // OAuth2User, so that type must be on the compile classpath.
        implementation 'org.springframework.security:spring-security-oauth2-core'

        // security-api's, hub's and finance's migrations, each with its own
        // history table; see HubFlywayConfig.
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-database-postgresql'

        implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

        // UserScopedRepositoryRules (see UserScopedRepositoryArchTest)
        testImplementation testFixtures(project(':api-core'))
    }
}

// Configure supabase-auth (library, never run standalone; see
// docs/supabase-auth.md): verifies Supabase Auth access tokens against the
// project's published keys (JWKS) and turns them into an authentication.
// No project dependencies and no secrets, so any module can use it without
// pulling in security-api's own login system.
project(':supabase-auth') {
    apply plugin: 'java-library'

    dependencies {
        // Jwt, JwtDecoder and the Nimbus types appear in this module's API.
        api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    }
}

// Configure engineering-api module (owner-only Engineering Hub; see
// docs/engineering-api.md). Depends on api-core and supabase-auth only: it
// never pulls in security-api's login system, users tables or scheduled jobs.
project(':engineering-api') {
    dependencies {
        implementation project(':api-core')

        // Resource server: verifies Supabase-issued JWTs against the
        // project's published keys (JWKS). No shared secret, no token minting.
        implementation project(':supabase-auth')
        implementation 'org.springframework.boot:spring-boot-starter-security'
        implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

        // Own schema and history table in its own database.
        implementation 'org.flywaydb:flyway-core'
        implementation 'org.flywaydb:flyway-database-postgresql'

        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

        // DTO <-> entity mapping (docs/coding-standards.md). The binding lets
        // MapStruct see the getters/setters Lombok generates in the same
        // compilation.
        implementation "org.mapstruct:mapstruct:${mapstructVersion}"
        annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
        annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

        testImplementation 'org.springframework.security:spring-security-test'
        // UserScopedRepositoryRules (see UserScopedRepositoryArchTest)
        testImplementation testFixtures(project(':api-core'))
    }
}
