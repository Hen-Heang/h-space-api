spring:
  application:
    name: hspace-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    show-sql: false

  # security-api's migrations (V1-V99) and this module's (V100+) share one
  # history table. out-of-order lets a later security-api migration (say V7)
  # still apply after V100 has; security-api on its own ignores V100+ as
  # "future" migrations.
  flyway:
    out-of-order: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration

jwt:
  secret: ${JWT_SECRET}
  expiration: PT24H
  refresh-token:
    expiration: P7D

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  reset-password:
    token-expiration-minutes: 1440
  email:
    from-name: H-Space API Team

server:
  port: ${SERVER_PORT:8084}
