spring:
  application:
    name: security-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jwt_auth}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}
  # Which profile-specific application-{profile}.yml to layer on top of this
  # base file. Defaults to "local" so `./gradlew :security-api:bootRun` works
  # out of the box; override with SPRING_PROFILES_ACTIVE in every other environment.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    show-sql: false

  # Flyway is the sole schema authority (see docs/database.md); every
  # profile's ddl-auto is "validate" - Hibernate checks the schema matches,
  # it never creates/alters it.
  flyway:
    enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration

jwt:
  secret: ${JWT_SECRET}
  expiration: PT24H
  refresh-token:
    expiration: P7D

# AES-256 key (Base64) used to encrypt TOTP secrets at rest - see
# MfaEncryptionConfig/MfaSecretConverter. Generate with `openssl rand -base64 32`.
mfa:
  encryption-key: ${MFA_ENCRYPTION_KEY}

google:
  # Comma-separated OAuth 2.0 client IDs from Google Cloud Console that are
  # allowed as the ID token audience. Empty means Google sign-in is disabled.
  client-ids: ${GOOGLE_CLIENT_IDS:}

# Temporary bridge while H-Space's data moves off Supabase
# (SupabaseBridgeService). All three must be set or /api/auth/supabase-token
# answers 503. jwt-secret is the project's *legacy* JWT secret (Dashboard >
# Project Settings > JWT Keys); service-role-key is server-only — never expose
# either to the frontend.
supabase:
  url: ${SUPABASE_URL:}
  jwt-secret: ${SUPABASE_JWT_SECRET:}
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  # Capped at PT15M: logout can't revoke a token already handed out.
  bridge-token-ttl: ${SUPABASE_BRIDGE_TOKEN_TTL:PT10M}
  # One-off account import (SupabaseUserImportRunner) - off unless started with
  # --supabase.import.enabled=true. See docs/supabase-user-import.md.
  import:
    enabled: false
    dry-run: true
    db-url: ${SUPABASE_DB_URL:}
    db-username: ${SUPABASE_DB_USERNAME:}
    db-password: ${SUPABASE_DB_PASSWORD:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # The owner's account is made ROLE_ADMIN once its email is verified (at
  # sign-in and at startup), and may always sign up. Empty = no owner.
  owner-email: ${OWNER_EMAIL:}
  signup:
    # invite-only: new accounts need an invite (POST /api/admin/invites) or
    # the owner's email. open: anyone may sign up. Anything else counts as
    # invite-only. Existing accounts sign in either way.
    mode: ${SIGNUP_MODE:invite-only}
  reset-password:
    token-expiration-minutes: 1440
  email:
    from-name: H-Space API Team
  email-verification:
    token-expiration-minutes: 1440
  # "Continue with email" one-time sign-in codes (EmailLoginCodeServiceImpl).
  email-login:
    code-expiration-minutes: 10
    resend-cooldown-seconds: 60
    max-attempts: 5
  account-lock:
    max-failed-attempts: 5
    lock-duration-minutes: 15
    unlock-token-expiration-minutes: 60
  password-policy:
    min-length: 12
    require-uppercase: true
    require-lowercase: true
    require-digit: true
    require-special-char: true

# See CacheConfig - bounds staleness of the "userPermissions" cache used by
# hasPermission(...) checks after a role/permission grant changes out from
# under an already-cached entry.
cache:
  permission:
    ttl-minutes: ${PERMISSION_CACHE_TTL_MINUTES:5}
    max-size: ${PERMISSION_CACHE_MAX_SIZE:10000}

server:
  port: ${SERVER_PORT:8080}

# Only /actuator/health is exposed (permitAll in WebSecurityConfig) - used by
# the Docker/Compose healthcheck. Details stay hidden from anonymous callers.
# Mail is excluded so an unreachable/placeholder SMTP server doesn't mark the
# whole app DOWN; the DB check stays in.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false
