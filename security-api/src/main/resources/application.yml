# security-api run on its own: `./gradlew :security-api:bootRun` and its tests.
# It isn't deployed - hub-api embeds it and is the deployed app. Every auth
# setting lives in security-api.yml (and security-api-{profile}.yml), shared
# with hub-api; only what belongs to this app alone stays here.
spring:
  application:
    name: security-api
  # Defaults to "local" so bootRun works out of the box (application-local.yml,
  # git-ignored, holds machine-local overrides); override with
  # SPRING_PROFILES_ACTIVE everywhere else.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: classpath:security-api.yml

server:
  port: ${SERVER_PORT:8080}
