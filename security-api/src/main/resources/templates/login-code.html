<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Your sign-in code</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                       style="background-color:#ffffff;border-radius:8px;padding:32px;">
                    <tr>
                        <td style="font-size:20px;font-weight:bold;color:#1a1a1a;padding-bottom:16px;">
                            H-Space
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size:14px;color:#4a4a4a;line-height:1.5;padding-bottom:20px;">
                            Enter this code to continue signing in to H-Space. It expires in
                            <span th:text="${expiresInMinutes}">10</span> minutes and can only be
                            used once.
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="padding-bottom:24px;">
                            <span th:text="${code}"
                                  style="display:inline-block;font-size:32px;font-weight:bold;
                                         letter-spacing:8px;color:#2563eb;background-color:#eff6ff;
                                         padding:12px 24px;border-radius:6px;font-family:monospace;">
                                123456
                            </span>
                        </td>
                    </tr>
                    <tr>
                        <td style="font-size:13px;color:#8a8a8a;line-height:1.5;">
                            If you didn't try to sign in, you can safely ignore this email - no
                            one can use the code without access to your inbox. Never share it with
                            anyone.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
