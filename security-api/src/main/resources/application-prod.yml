# Production. No fallback defaults for secrets — startup fails fast if
# DB_PASSWORD / JWT_SECRET / DB_URL aren't set rather than running insecurely.
spring:
  datasource:
    hikari:
      connection-timeout: 20000
      # Sized for one small VPS and a managed database's connection limit.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      # TLS to the database even when DB_URL doesn't say so. A sslmode in
      # DB_URL takes precedence: use it to go stricter (verify-full), never
      # weaker. Flyway uses this same pool.
      data-source-properties:
        sslmode: require
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # Schema changes go through a real migration tool before prod; the app
      # only validates the schema matches at startup.
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

mfa:
  encryption-key: ${MFA_ENCRYPTION_KEY}

# The web app's origin(s), e.g. https://hengo.henheang.site - no localhost
# fallback in production.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# No public API docs in production: Swagger UI and the OpenAPI spec map out
# every endpoint for anyone who finds them. Set API_DOCS_ENABLED=true to
# turn both on temporarily.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    root: WARN
    com.henheang: INFO
