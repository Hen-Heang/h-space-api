// Library module: shared by security-api, hub-api and engineering-api, and publishable for other
// APIs (`./gradlew :api-core:publishToMavenLocal`), never run standalone.
apply plugin: 'maven-publish'

bootJar {
    enabled = false
}

jar {
    enabled = true
    // Spring Boot's plugin tags the plain jar "-plain"; publish it as the
    // main artifact so consumers can depend on com.henheang:api-core.
    archiveClassifier = ''
    // api-core ships no Spring config: its application*.yml live in
    // src/test/resources, only so its own context test can boot. (They
    // moved there when api-core gained test fixtures, which put this jar -
    // not build/resources/main - on api-core's own test classpath.) Guard
    // against one being added to src/main/resources again: consumers bring
    // their own config.
    exclude 'application*.yml'
}

java {
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'api-core'
            from components.java
        }
    }
}
