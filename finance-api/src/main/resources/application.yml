spring:
  application:
    name: finance-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    show-sql: false

  # A deadline for every @Transactional unit of work (JPA repositories are
  # transactional by default; JdbcTemplate inside a transaction too): its
  # queries are cancelled once it runs out, so one slow query can't hold a
  # pool connection (5 in prod) indefinitely. Timeouts answer 503 "try
  # again" (GlobalExceptionHandler). Flyway isn't affected.
  transaction:
    default-timeout: ${DB_TRANSACTION_TIMEOUT:30s}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.OAuth2ClientAutoConfiguration

jwt:
  secret: ${JWT_SECRET}
  expiration: PT24H
  refresh-token:
    expiration: P7D

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # CORS origins for security-api's WebSecurityConfig, comma-separated.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  reset-password:
    token-expiration-minutes: 1440
  email:
    from-name: H-Space API Team

server:
  port: ${SERVER_PORT:8083}

# Prints the request's X-Request-Id (RequestIdFilter in api-core) on every log line.
logging:
  pattern:
    correlation: "[%X{requestId:-}] "
