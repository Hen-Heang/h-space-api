spring:
  datasource:
    hikari:
      connection-timeout: 20000
      # Same sizing as hub-api: several JVMs share one managed Postgres
      # (docs/database.md, docs/deploy-vps.md).
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      data-source-properties:
        sslmode: require
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

mfa:
  encryption-key: ${MFA_ENCRYPTION_KEY}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

finance:
  flyway:
    # security-api migrates its own schema; finance-api only runs
    # db/finance-migration (FinanceFlywayConfig).
    run-security-migrations: false

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  level:
    root: WARN
    com.henheang.financeapi: INFO
