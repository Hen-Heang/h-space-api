# Used by `./gradlew test` and CI. The JWT secret default below is a fixed,
# non-sensitive value used only for running tests.
spring:
  datasource:
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 5
      # open-api shares security-api's test database and scans its entities,
      # and create-drop below drops every mapped table when the context
      # closes. Run in a schema of its own so that never removes the tables
      # security-api's tests (Flyway + validate) rely on in `public`.
      schema: open_api_test
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jwt_auth_test}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123}

  # security-api's migrations are on this module's classpath; Flyway creates
  # the schema and records its history there too, not in `public`.
  flyway:
    default-schema: open_api_test

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: ${JWT_SECRET:6KReGxxaodLtxSNprFo4WeStpovMt6VOqiFOA1FtY67PfSkPckod2OzDIKpnLgsYAjEjQGZThOknDp+CD2+gcA==}

mfa:
  encryption-key: ${MFA_ENCRYPTION_KEY:A5WWtiNdlns02Wd/qEkyzrioceZqK2kZ4/CwJCsAC00=}

logging:
  level:
    com.henheang.openapi: WARN
